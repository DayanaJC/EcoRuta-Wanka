# Pruebas automatizadas de EcoRuta Wanka.
# 1) Pruebas unitarias y de integración del backend (Vitest + Supertest) con cobertura.
# 2) Suite E2E de Playwright en modo headless (Chromium, Firefox y WebKit) contra producción.
# Los reportes se guardan como artefactos (artifacts) de la ejecución.
name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unitarias:
    name: Unitarias e integración (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Las pruebas usan repositorios en memoria: no tocan la base de datos real
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage
      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: E2E Playwright (${{ matrix.navegador }})
    needs: unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imagen oficial de Playwright (misma versión que e2e/package.json): ya trae los
    # tres navegadores y sus dependencias del sistema, sin depender del Ubuntu del runner.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        navegador: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: e2e
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias de la suite
        run: npm ci
      # Neon (plan gratuito) se suspende sin uso: se "despierta" la API antes de medir
      - name: Calentar la API publicada
        run: |
          node -e "
            const rutas = ['health', 'api/v1/pedidos', 'api/v1/vehiculos', 'api/v1/clientes', 'api/v1/rutas'];
            (async () => {
              for (const r of rutas) {
                const t = Date.now();
                try { const res = await fetch('https://ecoruta-backend.vercel.app/' + r); console.log(r, res.status, (Date.now() - t) + ' ms'); }
                catch (e) { console.log(r, 'sin respuesta'); }
              }
            })();
          "
      - name: Ejecutar la suite E2E en modo headless
        run: npx playwright test --project=${{ matrix.navegador }}
      - name: Guardar el reporte HTML y las métricas de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright-${{ matrix.navegador }}
          path: |
            e2e/reportes/html/
            e2e/reportes/resultados.json
            e2e/reportes/metricas/
            e2e/reportes/artefactos/
          retention-days: 14
          if-no-files-found: ignore
